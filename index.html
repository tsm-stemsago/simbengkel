<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Bengkel TSM - SMKN 1 Gombong</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- SheetJS (xlsx) CDN untuk Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stemsago: {
                            blue: '#003399',
                            red: '#E31B23',
                            yellow: '#FFD700',
                            orange: '#FF8C00',
                            green: '#008000',
                            dark: '#0f172a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        @media print {
            .no-print, header, nav, .modal-backdrop { display: none !important; }
            .print-only { display: block !important; }
            body, main { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; overflow: visible !important; }
            .print-card { border: 1px solid #94a3b8 !important; box-shadow: none !important; padding: 12px !important; margin-bottom: 12px !important; break-inside: avoid; page-break-inside: avoid; }
            @page { size: A4 portrait; margin: 0.8cm; }
            table { width: 100% !important; border-collapse: collapse !important; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .border-double-custom { border-bottom: 3px solid black; position: relative; }
        .border-double-custom::after { content: ''; display: block; border-bottom: 1px solid black; margin-top: 2px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col" x-data="tsmApp()" x-init="initApp()">

    <!-- MAIN HEADER -->
    <header class="bg-slate-900 text-white border-b-4 border-amber-500 shadow-md sticky top-0 z-30 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                
                <!-- Dual Logos & Dynamic Title -->
                <div class="flex items-center space-x-3 sm:space-x-4">
                    <div class="flex items-center space-x-2 sm:space-x-3 bg-white/10 p-1.5 rounded-xl backdrop-blur-sm border border-white/10">
                        <!-- Logo STEMSAGO -->
                        <div class="h-10 sm:h-12 w-10 sm:w-12 flex items-center justify-center overflow-hidden rounded-lg bg-white/10 p-0.5">
                            <img :src="settings.logoKananUrl || defaultLogo" 
                                 alt="Logo SMKN 1 Gombong" 
                                 class="max-h-full max-w-full object-contain transition-transform hover:scale-105"
                                 @error="$event.target.onerror=null; $event.target.src=defaultLogo">
                        </div>
                        
                        <div class="h-8 w-px bg-slate-600/60"></div>

                        <!-- Logo TSM -->
                        <div class="h-10 sm:h-12 w-10 sm:w-12 flex items-center justify-center overflow-hidden rounded-lg bg-white/10 p-0.5">
                            <img :src="settings.logoTsmUrl || defaultLogo" 
                                 alt="Logo TSM SMKN 1 Gombong" 
                                 class="max-h-full max-w-full object-contain transition-transform hover:scale-105"
                                 @error="$event.target.onerror=null; $event.target.src=defaultLogo">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="bg-amber-500 text-slate-950 text-[10px] sm:text-xs font-black px-2 py-0.5 rounded tracking-wide uppercase" x-text="settings.singkatanBengkel || 'TSM STEMSAGO'">TSM STEMSAGO</span>
                            <span class="text-xs text-slate-400 hidden md:inline">Auto Service</span>
                        </div>
                        <h1 class="text-base sm:text-xl font-bold tracking-tight text-white leading-tight" x-text="settings.namaAplikasi || 'SISTEM MANAJEMEN BENGKEL TSM'">SISTEM MANAJEMEN BENGKEL TSM</h1>
                        <p class="text-xs text-slate-300 hidden sm:block" x-text="settings.namaSekolah || 'SMK NEGERI 1 GOMBONG'"></p>
                    </div>
                </div>

                <!-- User Auth Status & Action Buttons -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    
                    <button @click="initApp()" title="Status Firebase Cloud" class="hidden lg:flex items-center space-x-1.5 px-2.5 py-1 rounded-lg text-[11px] font-semibold border transition cursor-pointer"
                         :class="cloudConnected ? 'bg-emerald-950/60 text-emerald-300 border-emerald-700/50 hover:bg-emerald-900' : 'bg-red-950/60 text-red-300 border-red-700/50 hover:bg-red-900'">
                        <span class="w-2 h-2 rounded-full" :class="cloudConnected ? 'bg-emerald-400 animate-pulse' : 'bg-red-500'"></span>
                        <span x-text="cloudConnected ? 'Firebase Online' : 'Terputus'"></span>
                    </button>

                    <!-- AUTH USER BADGE & LOGIN/LOGOUT -->
                    <template x-if="currentUser">
                        <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
                            <div class="text-right">
                                <p class="text-[10px] text-amber-400 font-bold uppercase" x-text="userRole === 'admin' ? 'ADMIN BENGKEL' : 'PELIHAT'"></p>
                                <p class="text-[11px] text-slate-300 font-mono truncate max-w-[120px]" x-text="currentUser.email"></p>
                            </div>
                            <button @click="logout()" class="p-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg transition" title="Logout">
                                <i class="fa-solid fa-right-from-bracket text-xs"></i>
                            </button>
                        </div>
                    </template>

                    <template x-if="!currentUser">
                        <button @click="modals.login = true" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 transition">
                            <i class="fa-solid fa-user-shield"></i>
                            <span>Login Admin</span>
                        </button>
                    </template>

                    <button @click="openSettings()" 
                            class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-amber-400 border border-slate-700 rounded-xl transition shadow-sm cursor-pointer"
                            title="Pengaturan Bengkel & Logo">
                        <i class="fa-solid fa-gear text-sm"></i>
                    </button>

                    <button @click="openModal('studentLoan')" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs flex items-center space-x-1.5 shadow-lg transition active:scale-95">
                        <i class="fa-solid fa-hand-holding-hand"></i>
                        <span class="hidden sm:inline">Ajukan</span> Pinjam Alat
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- NAVIGATION BAR -->
    <nav class="bg-slate-800 border-b border-slate-700 no-print sticky top-20 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex space-x-1 overflow-x-auto custom-scrollbar py-2">
                <button @click="activeTab = 'dashboard'" 
                        :class="activeTab === 'dashboard' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-300 hover:bg-slate-700 hover:text-white'"
                        class="px-3.5 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-2 whitespace-nowrap transition">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </button>

                <button @click="activeTab = 'peminjaman'" 
                        :class="activeTab === 'peminjaman' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-300 hover:bg-slate-700 hover:text-white'"
                        class="px-3.5 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-2 whitespace-nowrap transition">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    <span>Peminjaman Alat</span>
                    <template x-if="pendingLoansCount > 0">
                        <span class="px-1.5 py-0.5 text-[10px] rounded-full bg-red-600 text-white font-bold animate-pulse" x-text="pendingLoansCount"></span>
                    </template>
                </button>

                <button @click="activeTab = 'alat'" 
                        :class="activeTab === 'alat' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-300 hover:bg-slate-700 hover:text-white'"
                        class="px-3.5 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-2 whitespace-nowrap transition">
                    <i class="fa-solid fa-wrench"></i>
                    <span>Inventaris Alat</span>
                    <span class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-slate-900/40 text-slate-200" x-text="alatList.length"></span>
                </button>

                <button @click="activeTab = 'opname'" 
                        :class="activeTab === 'opname' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-300 hover:bg-slate-700 hover:text-white'"
                        class="px-3.5 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-2 whitespace-nowrap transition">
                    <i class="fa-solid fa-clipboard-check"></i>
                    <span>Stok Opname Bahan</span>
                    <template x-if="lowStockCount > 0">
                        <span class="px-1.5 py-0.5 text-[10px] rounded-full bg-amber-600 text-white font-bold" x-text="lowStockCount"></span>
                    </template>
                </button>

                <button @click="activeTab = 'penggunaan'" 
                        :class="activeTab === 'penggunaan' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-300 hover:bg-slate-700 hover:text-white'"
                        class="px-3.5 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-2 whitespace-nowrap transition">
                    <i class="fa-solid fa-oil-can"></i>
                    <span>Penggunaan Bahan</span>
                </button>

                <button @click="activeTab = 'laporan'" 
                        :class="activeTab === 'laporan' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-300 hover:bg-slate-700 hover:text-white'"
                        class="px-3.5 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-2 whitespace-nowrap transition">
                    <i class="fa-solid fa-file-lines"></i>
                    <span>Laporan & Cetak</span>
                </button>

                <template x-if="userRole === 'admin'">
                    <button @click="activeTab = 'audit'" 
                            :class="activeTab === 'audit' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-300 hover:bg-slate-700 hover:text-white'"
                            class="px-3.5 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-2 whitespace-nowrap transition">
                        <i class="fa-solid fa-list-check"></i>
                        <span>Audit Log</span>
                    </button>
                </template>
            </div>
        </div>
    </nav>

    <!-- ROLE INDICATOR BANNER -->
    <div class="bg-amber-500/10 border-b border-amber-500/30 py-1.5 px-4 no-print">
        <div class="max-w-7xl mx-auto flex items-center justify-between text-xs text-slate-700">
            <div class="flex items-center space-x-2">
                <span class="font-bold uppercase tracking-wider px-2 py-0.5 rounded text-[10px]"
                      :class="userRole === 'admin' ? 'bg-slate-900 text-amber-400' : 'bg-slate-200 text-slate-700'">
                    Status Akses: <span x-text="userRole === 'admin' ? 'MODE ADMIN (AKSES PENUH)' : 'MODE PELIHAT (READ ONLY)'"></span>
                </span>
                <span class="text-slate-500 hidden md:inline" x-text="userRole === 'admin' ? 'Dapat menambah, mengedit, menyetujui peminjaman, & mengubah pengaturan.' : 'Siswa/Tamu dapat mengajukan peminjaman alat mandiri & melihat stok.'"></span>
            </div>
            <div class="font-mono text-[11px] text-slate-500 hidden sm:block">
                <span x-text="currentDate"></span> | <span class="font-semibold text-slate-800" x-text="currentTime"></span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- NOTIFICATION TOAST -->
        <div x-show="toast.show" x-transition 
             class="fixed bottom-5 right-5 z-50 p-4 rounded-xl shadow-2xl flex items-center space-x-3 text-white border no-print"
             :class="toast.type === 'success' ? 'bg-emerald-600 border-emerald-500' : 'bg-red-600 border-red-500'"
             x-cloak>
            <i class="text-xl" :class="toast.type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-triangle-exclamation'"></i>
            <div>
                <h4 class="font-bold text-sm" x-text="toast.title"></h4>
                <p class="text-xs text-slate-100" x-text="toast.message"></p>
            </div>
        </div>

        <!-- DASHBOARD TAB -->
        <div x-show="activeTab === 'dashboard'" class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Menunggu Persetujuan</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" x-text="pendingLoansCount">0</h3>
                </div>
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Alat Aktif Dipinjam</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" x-text="activeLoansCount">0</h3>
                </div>
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Total Jenis Alat</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" x-text="totalToolItems">0</h3>
                </div>
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Stok Bahan Kritis</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" x-text="lowStockCount">0</h3>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-4">Pengajuan Peminjaman Alat Mandiri (Siswa)</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 text-slate-500 font-semibold uppercase">
                            <tr>
                                <th class="p-2.5">Peminjam</th>
                                <th class="p-2.5">Kelas</th>
                                <th class="p-2.5">Alat</th>
                                <th class="p-2.5 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="loan in pendingLoans" :key="loan.id">
                                <tr>
                                    <td class="p-2.5 font-bold" x-text="loan.namaPeminjam"></td>
                                    <td class="p-2.5" x-text="loan.kelas"></td>
                                    <td class="p-2.5 text-amber-700 font-bold" x-text="loan.namaAlat"></td>
                                    <td class="p-2.5 text-right">
                                        <template x-if="userRole === 'admin'">
                                            <button @click="approveLoan(loan.id)" class="bg-emerald-600 text-white px-2 py-1 rounded text-[10px] font-bold">Setujui</button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                            <template x-if="pendingLoans.length === 0">
                                <tr><td colspan="4" class="p-4 text-center text-slate-400">Tidak ada pengajuan pending.</td></tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL LOGIN ADMIN -->
    <div x-show="modals.login" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4" @click.away="modals.login = false">
            <h3 class="font-bold text-slate-800 text-center">Masuk Mode Admin</h3>
            <form @submit.prevent="loginAdmin()" class="space-y-3 text-xs">
                <div>
                    <label class="font-bold text-slate-700 block mb-1">Email</label>
                    <input type="email" x-model="loginForm.email" required class="w-full p-2.5 bg-slate-50 border rounded-xl">
                </div>
                <div>
                    <label class="font-bold text-slate-700 block mb-1">Password</label>
                    <input type="password" x-model="loginForm.password" required class="w-full p-2.5 bg-slate-50 border rounded-xl">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" @click="modals.login = false" class="w-1/2 py-2.5 bg-slate-100 font-bold rounded-xl">Batal</button>
                    <button type="submit" class="w-1/2 py-2.5 bg-amber-500 font-bold rounded-xl">Masuk</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT MODULE FIREBASE & ALPINE APP -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs, getDoc,
            runTransaction, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMt9Y9xy6J5470BYH9GjqjdnVBYMt3kfc",
            authDomain: "simbengkeltsm.firebaseapp.com",
            projectId: "simbengkeltsm",
            storageBucket: "simbengkeltsm.firebasestorage.app",
            messagingSenderId: "675793932175",
            appId: "1:675793932175:web:11b08b2a90b9b04e8645fa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.tsmApp = function () {
            return {
                defaultLogo: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23FF8C00'/%3E%3C/svg%3E",
                userRole: 'pelihat',
                currentUser: null,
                loginForm: { email: '', password: '' },
                cloudConnected: true,
                activeTab: 'dashboard',
                currentDate: '',
                currentTime: '',

                alatList: [],
                bahanList: [],
                loanList: [],
                settings: {},
                toast: { show: false, title: '', message: '', type: 'success' },
                modals: { login: false, studentLoan: false },

                async initApp() {
                    this.updateClock();
                    setInterval(() => this.updateClock(), 1000);

                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            this.currentUser = user;
                            try {
                                const userSnap = await getDoc(doc(db, 'users', user.uid));
                                this.userRole = (userSnap.exists() && userSnap.data().role === 'admin') ? 'admin' : 'pelihat';
                            } catch(e) {
                                this.userRole = 'pelihat';
                            }
                        } else {
                            this.currentUser = null;
                            this.userRole = 'pelihat';
                        }
                    });

                    onSnapshot(collection(db, 'alat'), (snap) => {
                        this.alatList = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                    });

                    onSnapshot(collection(db, 'bahan'), (snap) => {
                        this.bahanList = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                    });

                    onSnapshot(collection(db, 'loans'), (snap) => {
                        this.loanList = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                    });

                    onSnapshot(doc(db, 'settings', 'general'), (snap) => {
                        if (snap.exists()) this.settings = snap.data();
                    });
                },

                async loginAdmin() {
                    try {
                        await signInWithEmailAndPassword(auth, this.loginForm.email, this.loginForm.password);
                        this.modals.login = false;
                        this.loginForm = { email: '', password: '' };
                        this.showToast('Login Berhasil', 'Masuk Mode Admin');
                    } catch (err) {
                        this.showToast('Login Gagal', err.message, 'error');
                    }
                },

                async logout() {
                    await signOut(auth);
                    this.showToast('Logout', 'Anda kembali ke Mode Pelihat');
                },

                get pendingLoans() { return this.loanList.filter(l => l.status === 'Menunggu Persetujuan'); },
                get pendingLoansCount() { return this.pendingLoans.length; },
                get activeLoansCount() { return this.loanList.filter(l => l.status === 'Dipinjam').length; },
                get totalToolItems() { return this.alatList.length; },
                get lowStockCount() { return this.bahanList.filter(b => b.stokSistem <= b.minStok).length; },

                showToast(title, message, type = 'success') {
                    this.toast = { show: true, title, message, type };
                    setTimeout(() => { this.toast.show = false; }, 3000);
                },

                updateClock() {
                    const now = new Date();
                    this.currentDate = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    this.currentTime = now.toLocaleTimeString('id-ID') + ' WIB';
                }
            }
        };
    </script>
</body>
</html>
